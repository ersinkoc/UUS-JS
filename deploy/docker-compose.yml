version: '3.8'

services:
  # Development environment
  dev:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile
      target: builder
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/packages/*/node_modules
    ports:
      - "5173:5173"  # Vite dev server
      - "3000:3000"  # API server
    environment:
      - NODE_ENV=development
    command: pnpm dev
    networks:
      - uusjs

  # Dashboard example
  dashboard:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile
    working_dir: /app/examples/dashboard
    ports:
      - "5001:5173"
    command: pnpm dev
    networks:
      - uusjs

  # E-commerce example
  ecommerce:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile
    working_dir: /app/examples/ecommerce
    ports:
      - "5002:5173"
    command: pnpm dev
    networks:
      - uusjs

  # Realtime chat example
  chat:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile
    working_dir: /app/examples/realtime-chat
    ports:
      - "3001:3000"  # WebSocket server
      - "5003:5173"  # Frontend
    command: sh -c "pnpm start & pnpm client"
    networks:
      - uusjs

  # i18n demo
  i18n:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile
    working_dir: /app/examples/i18n-demo
    ports:
      - "5004:5173"
    command: pnpm dev
    networks:
      - uusjs

networks:
  uusjs:
    driver: bridge